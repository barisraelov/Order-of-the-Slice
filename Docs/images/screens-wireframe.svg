<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17324d"/>
      <stop offset="1" stop-color="#102437"/>
    </linearGradient>
    <linearGradient id="game" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4d8"/>
      <stop offset="1" stop-color="#f3c981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#07121d" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 700 36px Arial, sans-serif; fill: #fff; }
      .sub { font: 400 18px Arial, sans-serif; fill: #b9ccdc; }
      .label { font: 700 18px Arial, sans-serif; fill: #17324d; }
      .small { font: 400 15px Arial, sans-serif; fill: #39536a; }
      .hud { font: 700 20px Arial, sans-serif; fill: #fff; }
      .panelTitle { font: 700 22px Arial, sans-serif; fill: #fff; }
      .panelText { font: 400 16px Arial, sans-serif; fill: #d7e5ef; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="70" y="65" class="title">Order of the Slice — Screen &amp; HUD Layout</text>
  <text x="70" y="98" class="sub">Landscape reference: 1920 × 1080 • anchored HUD • safe-area aware</text>

  <g filter="url(#shadow)">
    <rect x="70" y="135" width="1120" height="630" rx="24" fill="url(#game)" stroke="#f4b544" stroke-width="5"/>
    <rect x="90" y="155" width="1080" height="82" rx="14" fill="#17324d" opacity="0.94"/>
  </g>

  <g aria-label="Gameplay HUD">
    <text x="120" y="205" class="hud">♥ ♥ ♥</text>
    <text x="480" y="185" class="hud">RECIPE: CAPRESE</text>
    <circle cx="500" cy="214" r="16" fill="#e94b3c"/>
    <path d="M494 198 L500 189 L506 198" fill="#3c9b45"/>
    <rect x="537" y="198" width="34" height="28" rx="5" fill="#ffe56a" stroke="#bd9b26"/>
    <ellipse cx="610" cy="212" rx="22" ry="12" fill="#4cad55"/>
    <path d="M610 199 Q620 212 610 225 Q600 212 610 199" fill="#70d978"/>
    <rect x="488" y="224" width="150" height="5" rx="3" fill="#f4b544"/>
    <text x="930" y="188" class="hud">SCORE  1,280</text>
    <text x="930" y="217" class="hud">Ⅱ</text>
  </g>

  <g aria-label="Gameplay objects">
    <path d="M220 650 Q420 330 610 560" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.82"/>
    <circle cx="435" cy="410" r="46" fill="#e94b3c" stroke="#c1372b" stroke-width="5"/>
    <path d="M422 368 L435 350 L448 368" fill="#3c9b45"/>
    <rect x="735" y="390" width="86" height="68" rx="12" fill="#ffe56a" stroke="#bd9b26" stroke-width="5" transform="rotate(12 778 424)"/>
    <circle cx="940" cy="490" r="43" fill="#252a30" stroke="#0c0f12" stroke-width="6"/>
    <path d="M948 447 Q970 420 995 435" fill="none" stroke="#ae7138" stroke-width="8"/>
    <circle cx="999" cy="435" r="9" fill="#ff643d"/>
    <path d="M360 585 Q560 430 800 520" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
    <circle cx="610" cy="505" r="8" fill="#ffef91"/>
    <circle cx="650" cy="482" r="6" fill="#ffef91"/>
    <circle cx="690" cy="477" r="10" fill="#ffef91"/>
    <text x="498" y="612" class="label">COMBO ×7</text>
    <text x="875" y="560" class="small">readable bomb silhouette</text>
  </g>

  <g aria-label="Fever meter">
    <rect x="310" y="700" width="640" height="30" rx="15" fill="#17324d"/>
    <rect x="315" y="705" width="455" height="20" rx="10" fill="#ff6848"/>
    <text x="970" y="722" class="label">FEVER</text>
  </g>

  <g aria-label="Callouts">
    <rect x="95" y="275" width="205" height="72" rx="12" fill="#fff" opacity="0.92"/>
    <text x="115" y="305" class="label">Safe-area HUD</text>
    <text x="115" y="330" class="small">Lives, recipe, score</text>
    <path d="M300 310 L355 235" stroke="#39536a" stroke-width="3"/>

    <rect x="840" y="275" width="290" height="72" rx="12" fill="#fff" opacity="0.92"/>
    <text x="860" y="305" class="label">Recipe is always visible</text>
    <text x="860" y="330" class="small">Next ingredient is highlighted</text>
    <path d="M840 310 L640 225" stroke="#39536a" stroke-width="3"/>
  </g>

  <g transform="translate(1240 135)" filter="url(#shadow)">
    <rect width="290" height="190" rx="20" fill="#213f59" stroke="#52708a" stroke-width="3"/>
    <text x="24" y="42" class="panelTitle">MAIN MENU</text>
    <text x="24" y="75" class="panelText">Order of the Slice</text>
    <rect x="24" y="95" width="242" height="42" rx="12" fill="#f4b544"/>
    <text x="122" y="122" text-anchor="middle" class="label">PLAY</text>
    <text x="24" y="165" class="panelText">High Score • Instructions</text>
  </g>

  <g transform="translate(1240 355)" filter="url(#shadow)">
    <rect width="290" height="190" rx="20" fill="#213f59" stroke="#52708a" stroke-width="3"/>
    <text x="24" y="42" class="panelTitle">PAUSE</text>
    <rect x="24" y="65" width="242" height="34" rx="10" fill="#f4b544"/>
    <text x="145" y="88" text-anchor="middle" class="label">RESUME</text>
    <text x="24" y="128" class="panelText">Restart</text>
    <text x="24" y="158" class="panelText">Main Menu</text>
  </g>

  <g transform="translate(1240 575)" filter="url(#shadow)">
    <rect width="290" height="190" rx="20" fill="#213f59" stroke="#52708a" stroke-width="3"/>
    <text x="24" y="42" class="panelTitle">GAME OVER</text>
    <text x="24" y="78" class="panelText">Final Score • High Score</text>
    <rect x="24" y="98" width="242" height="38" rx="11" fill="#f4b544"/>
    <text x="145" y="124" text-anchor="middle" class="label">RESTART</text>
    <text x="24" y="166" class="panelText">Main Menu</text>
  </g>

  <g transform="translate(70 820)">
    <rect width="1460" height="115" rx="18" fill="#213f59" stroke="#52708a" stroke-width="2"/>
    <text x="28" y="40" class="panelTitle">Readability rules</text>
    <text x="28" y="74" class="panelText">Large silhouettes • one highlighted target • no high score during play • no inventory or side objectives</text>
    <text x="28" y="99" class="panelText">Mouse and touch share the same swipe language; UI remains outside the main cutting space.</text>
  </g>
</svg>
